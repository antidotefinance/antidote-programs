[package]
name = "lv-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "LiteSVM suites: the spot engine, levpad-hook, levcap and levfee SBF artifacts, with the real Meteora DBC and DAMM v2 devnet builds"

[lib]
path = "lib.rs"

[dependencies]

[dev-dependencies]
anchor-lang = "=0.31.1"
tilt-spot = { path = "../programs/tilt-spot", features = ["no-entrypoint"] }
levpad-math = { path = "../crates/levpad-math" }
litesvm = "=0.6.1"
solana-keypair = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
solana-account = "2.2"
solana-compute-budget-interface = "2.2"
spl-token-2022 = { version = "6.0.0", features = ["no-entrypoint"] }
solana-message = "2.2"
levpad-hook = { path = "../programs/levpad-hook", features = ["no-entrypoint"] }
levcap = { path = "../programs/levcap", features = ["no-entrypoint"] }
levfee = { path = "../programs/levfee", features = ["no-entrypoint"] }
antidote-ideas = { path = "../programs/antidote-ideas", features = ["no-entrypoint"] }
serde_json = "1"
base64 = "0.22.1"
borsh = { version = "1", features = ["derive"] }
bincode = "1.3"
quick-xml = "=0.26.0"
spl-tlv-account-resolution = "0.9.0"
spl-transfer-hook-interface = "0.9.0"
spl-discriminator = "0.4.1"
