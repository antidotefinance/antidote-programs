[package]
name = "antidote-ideas"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false
description = "antidote-ideas: on-chain suggestions and votes for Antidote. Holders of the platform token suggest ideas and vote once per wallet per idea; at the vote threshold an idea moves to InReview on chain. Ideas can be forked (one level), and the admin seeds curated ideas (running experiments) that take the same votes. Separate from the launch programs."

[lib]
crate-type = ["cdylib", "lib"]

[features]
# no-idl by default, as the launch programs: no IDL account an authority could rewrite
default = ["no-idl"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
solana-security-txt = "=1.1.3"
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022"] }
