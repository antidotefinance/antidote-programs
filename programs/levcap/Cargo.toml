[package]
name = "levcap"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"
publish = false
description = "levcap: the capped, rule-bound mint authority for the platform token. Holds a mint authority behind a PDA, reserves and mints only for one fixed minter, keeps supply plus owed under a lifetime cap (burns free room) and new commitments under a per-UTC-day ceiling. No admin, no setters; deployed immutable."

[lib]
crate-type = ["cdylib", "lib"]

[features]
# no-idl by default: Anchor's IDL instructions (an IDL account its authority can rewrite) are left
# out of the deployed program, so its whole surface is `register` and `mint_to`
default = ["no-idl"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
solana-security-txt = "=1.1.3"
anchor-lang = "=0.31.1"
anchor-spl = { version = "=0.31.1", default-features = false, features = ["token", "token_2022"] }
